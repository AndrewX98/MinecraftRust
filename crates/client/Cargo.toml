[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

corelib = { path = "../corelib" }
linker = { path = "../linker" }
libc-shim = { path = "../libc-shim" }
minecraft-imported-symbols = { path = "../minecraft-imported-symbols" }
util = { path = "../util" }
apkinfo = { path = "../apkinfo" }
libjnivm-sys = { path = "../libjnivm-sys" }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.11", features = ["blocking"] }
tungstenite = "0.21"
url = "2"

simple-ipc = { path = "../simple-ipc" }
daemon-utils = { path = "../daemon-utils" }
msa-daemon-client = { path = "../msa-daemon-client" }
cll-telemetry = { path = "../cll-telemetry" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "process", "fs", "sync", "io-util", "net"] }

# X11 is only used by the Linux eglut backend (macOS uses platform/macos/*);
# cpal's macOS backend needs the Apple SDK, so it is also target-gated
[target.'cfg(not(target_os = "macos"))'.dependencies]
x11 = "2.21"
cpal = "0.15"

# GLFW/Cocoa window backend for macOS (docs/PORT_MACOS.md Phase 4); links the
# system libglfw (brew install glfw)
[target.'cfg(target_os = "macos")'.dependencies]
glfw = "0.62"

[lints]
workspace = true
