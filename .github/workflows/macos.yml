name: build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1) — primary target
          - os: macos-15
            arch: aarch64-apple-darwin
            label: arm64 (Apple Silicon)
          # Intel — x86_64-apple-darwin
          - os: macos-13
            arch: x86_64-apple-darwin
            label: x86_64 (Intel)
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}

      - name: Build (debug)
        run: cargo build -p client --target ${{ matrix.arch }}

      - name: Build (release)
        run: cargo build -p client --release --target ${{ matrix.arch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/client
          if-no-files-found: error
