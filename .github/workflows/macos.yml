name: build

on:
  workflow_dispatch:

env:
  # keep CI output clean; local builds still show diagnostics
  RUSTFLAGS: "-Awarnings"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M1) — primary target
          - os: macos-15
            arch: aarch64-apple-darwin
            march: arm64
            label: arm64 (Apple Silicon)
          # Intel: cross-compiled on the M1 runner (macos-13 Intel runners
          # were retired by GitHub; Xcode SDK ships both architectures)
          - os: macos-15
            arch: x86_64-apple-darwin
            march: x86_64
            label: x86_64 (Intel, cross-built)
    runs-on: ${{ matrix.os }}
    name: macOS ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      # libglfw for the target arch; the Intel cross-build needs an
      # x86_64 slice which brew (arm64-only) does not ship
      - name: Build GLFW (${{ matrix.arch }})
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git $RUNNER_TEMP/glfw-src
          cmake -S $RUNNER_TEMP/glfw-src -B $RUNNER_TEMP/glfw-build \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.march }} \
            -DBUILD_SHARED_LIBS=ON -DGLFW_BUILD_DOCS=OFF \
            -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF
          cmake --build $RUNNER_TEMP/glfw-build --parallel
          sudo make -C $RUNNER_TEMP/glfw-build install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}

      - name: Build (release)
        run: cargo build -p client --release --target ${{ matrix.arch }}

      # arm64 only: run the launcher with no game files — window creation
      # happens before libminecraftpe load, so this proves Cocoa/GLFW/GL work
      - name: Smoke run + screenshot
        if: matrix.march == 'arm64'
        run: |
          DYLD_LIBRARY_PATH=/usr/local/lib MCPELAUNCHER_SMOKE_SECS=12 \
            ./target/aarch64-apple-darwin/release/client -dg /tmp/no-game-dir &
          APP_PID=$!
          sleep 6
          screencapture -x "$RUNNER_TEMP/smoke.png" || true
          wait $APP_PID || true
        shell: bash

      - name: Upload screenshot
        if: matrix.march == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-arm64
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: warn

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/client
          if-no-files-found: error

  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++-12-dev libpulse-dev libx11-dev \
            libegl1-mesa-dev libcurl4-openssl-dev libssl-dev libsdl2-dev \
            libudev-dev libpng-dev libevdev-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Build (debug)
        run: cargo build -p client
